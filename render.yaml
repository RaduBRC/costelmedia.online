# Render Blueprint for the backend API + in-process cron scheduler.
# https://render.com/docs/blueprint-spec
#
# NOTE on "zero cost" + the reminder scheduler: Render's free web services
# spin down after ~15 minutes of no inbound HTTP traffic and spin back up
# on the next request. node-cron only fires while the process is actually
# running, so on the free plan the 5-minute reminder cycle effectively
# pauses during idle periods and catches up (via the claim-pattern queries,
# which are always correct regardless of how long it's been) once
# something wakes the service — a paid instance (or an external uptime
# ping hitting /health every few minutes) is what keeps it truly real-time.
services:
  - type: web
    name: ai-booking-platform-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "8787"
      - key: CRON_ENABLED
        value: "true"
      - key: APNS_USE_SANDBOX
        value: "false"
      # Secrets — set these in the Render dashboard, not in this file.
      - key: GROQ_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_EMAIL
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY
        sync: false
      - key: FCM_PROJECT_ID
        sync: false
      - key: APNS_KEY_ID
        sync: false
      - key: APNS_TEAM_ID
        sync: false
      - key: APNS_BUNDLE_ID
        sync: false
      - key: APNS_PRIVATE_KEY
        sync: false
      - key: WEB_PUSH_VAPID_PUBLIC_KEY
        sync: false
      - key: WEB_PUSH_VAPID_PRIVATE_KEY
        sync: false
      - key: WEB_PUSH_CONTACT_EMAIL
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false
      - key: TWILIO_WHATSAPP_NUMBER
        sync: false
      # This service's own public origin (api.costelmedia.online, CNAMEd to
      # this Render service — see the conversation this was decided in).
      # Twilio signature verification needs to reconstruct the exact
      # webhook URL it signed (see src/api/webhooks.ts), and
      # GOOGLE_OAUTH_REDIRECT_URI below has to exactly match what's
      # registered on the OAuth client in Google Cloud Console.
      - key: PUBLIC_WEBHOOK_BASE_URL
        value: https://api.costelmedia.online
      - key: GOOGLE_OAUTH_REDIRECT_URI
        value: https://api.costelmedia.online/api/integrations/google/callback
      # The frontend's own origin — where /callback and password-reset
      # links send the browser back to (see googleIntegration.ts,
      # ForgotPasswordPage.tsx).
      - key: FRONTEND_ORIGIN
        value: https://costelmedia.online
      # CORS allowlist (src/server/app.ts) — both the apex and www, since
      # either is a valid way a visitor reaches the frontend.
      - key: ALLOWED_ORIGINS
        value: https://costelmedia.online,https://www.costelmedia.online
      # Not secret — the OAuth Client ID is already public in every
      # consent URL this app generates (see googleOAuthTokens.ts), unlike
      # the two below.
      - key: GOOGLE_OAUTH_CLIENT_ID
        value: 181149482891-6vqoim5nll6l8eirnl9v7669v9f7ns74.apps.googleusercontent.com
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        sync: false
      # Generate a FRESH one for production — do not reuse the value from
      # any local .env. See googleOAuthTokens.ts's own comment for the
      # generation command.
      - key: GOOGLE_OAUTH_TOKEN_ENCRYPTION_KEY
        sync: false
